# Render Blueprint — creates the web app (Docker) + a free PostgreSQL database.
# Deploy: https://render.com/deploy?repo=<this GitHub repo URL>
services:
  - type: web
    name: amaliyot-kundaligi
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amaliyot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Load demo data on the very first start (only when the database is empty)
      - key: SEED_DEMO_DATA
        value: 'true'
      - key: REMINDER_HOUR
        value: '18'
      # Your own bot from @BotFather (can be added later in the Render dashboard → Environment)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false

databases:
  - name: amaliyot-db
    plan: free
    region: frankfurt
    databaseName: internship_diary
    user: amaliyot
